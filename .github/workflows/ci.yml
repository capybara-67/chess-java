name: Check Java game
on: [push, pull_request]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p build
      - run: javac -d build src/Main32.java tests/ChessTest.java
      - run: java -Djava.awt.headless=true -cp build ChessTest
